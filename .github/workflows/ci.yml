name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_API_URL: https://api.example.invalid
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTHDOMAIN: ci.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.invalid
          NEXT_PUBLIC_FIREBASE_MESSAGEING_SENDER_ID: "123456789"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:ci
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-CI
